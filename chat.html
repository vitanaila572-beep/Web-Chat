<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexChat</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:linear-gradient(160deg,#07111f,#111827,#1e3a8a);height:100vh}
.app{max-width:430px;height:100vh;margin:auto;background:#0f172a;display:flex;flex-direction:column}
.top{padding:14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1f2937}
#photo{width:48px;height:48px;border-radius:50%;object-fit:cover}
.info h2{color:#fff;font-size:17px}
.info p{color:#94a3b8;font-size:12px}
.chat{flex:1;overflow:auto;padding:16px}
.date{margin:auto auto 18px;width:max-content;padding:6px 14px;border-radius:999px;background:#1f2937;color:#cbd5e1;font-size:12px}
.row{display:flex;gap:8px;margin-bottom:14px}
.row.me{justify-content:flex-end}
.avatar{width:34px;height:34px;border-radius:50%}
.bubble{max-width:74%;padding:10px 14px;border-radius:18px;color:#fff}
.other .bubble{background:#1f2937}
.me .bubble{background:#2563eb}
.sender{color:#93c5fd;font-size:11px;margin-bottom:4px}
.bottom{padding:12px;display:flex;gap:10px;border-top:1px solid #1f2937}
.input{flex:1;background:#1f2937;border-radius:24px;padding:0 14px}
#text{width:100%;background:transparent;border:none;color:#fff;padding:14px 0;outline:none}
#send{width:46px;border:none;border-radius:50%;background:#2563eb;color:#fff;font-size:18px}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <img id="photo" src="assets/img/default-avatar.png">
    <div class="info">
      <h2 id="username">Memuat...</h2>
      <p>Realtime Community Chat</p>
    </div>
  </div>

  <div class="chat" id="messages">
    <div class="date">Hari Ini</div>
  </div>

  <div class="bottom">
    <div class="input">
      <input id="text" placeholder="Tulis pesan...">
    </div>
    <button id="send">➤</button>
  </div>
</div>

<script type="module" src="./assets/js/chat.js"></script>
</body>
</html>
