<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexChat • Login</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
      overflow:hidden;
    }
    .bg{
      position:absolute;
      width:300px;height:300px;
      background:rgba(255,255,255,.08);
      border-radius:50%;
      filter:blur(20px);
    }
    .bg:nth-child(1){top:-80px;left:-60px}
    .bg:nth-child(2){bottom:-100px;right:-40px}

    .card{
      position:relative;
      width:340px;
      background:rgba(255,255,255,.12);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.2);
      border-radius:24px;
      padding:30px 24px;
      text-align:center;
      color:#fff;
      box-shadow:0 15px 40px rgba(0,0,0,.25);
    }
    .logo{
      width:80px;height:80px;
      margin:auto;
      border-radius:22px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
    }
    h1{margin:18px 0 8px;font-size:28px}
    p{font-size:14px;color:#dbeafe;line-height:1.5}
    .google{
      margin-top:28px;
      width:100%;
      border:none;
      border-radius:14px;
      padding:14px;
      background:#fff;
      color:#111827;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      cursor:pointer;
      transition:.25s;
    }
    .google:hover{transform:translateY(-2px)}
    .footer{margin-top:18px;font-size:11px;color:#bfdbfe}
  </style>
</head>
<body>

<div class="bg"></div>
<div class="bg"></div>

<div class="card">
  <div class="logo">💬</div>
  <h1>NexChat</h1>
  <p>Ngobrol realtime dengan teman menggunakan akun Google.</p>

  <button class="google" id="loginBtn">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.6 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.2-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.5-6 7l6.2 5.2C39 36.9 44 31 44 24c0-1.2-.1-2.3-.4-3.5z"/>
    </svg>
    Lanjutkan dengan Google
  </button>

  <div class="footer">By Syafaat • Firebase Authentication</div>
</div>

<script type="module">
import { loginGoogle } from "./assets/js/auth.js";

document.getElementById("loginBtn").addEventListener("click", async () => {
  await loginGoogle();
});
</script>

</body>
</html>
